<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Moisty Canvas</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/lib/signalr.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="connection" class="status" role="status">Connecting…</div>
  <main class="layout">
    <section class="canvas-area" aria-label="Shared pixel canvas">
      <div class="board-shell">
        <div id="viewport" class="viewport" aria-label="Canvas: scroll to zoom, shift-drag to pan">
          <canvas id="board" width="128" height="128" aria-label="Draw on the shared canvas"></canvas>
          <canvas id="gridOverlay" aria-hidden="true"></canvas>
        </div>
      </div>
      <div class="board-meta">
        <span class="coords" id="coords">—, —</span>
        <span class="zoom" id="zoom">100%</span>
      </div>
    </section>

    <aside class="controls">
      <div class="section-heading"><h2>Color</h2><input id="nativeColor" type="color" value="#D14C4C" aria-label="System color picker" title="System color picker"></div>
      <div id="colorField" class="color-field" role="group" aria-label="Saturation and brightness">
        <div id="colorHandle" class="color-handle" aria-hidden="true"></div>
      </div>
      <input id="hue" class="hue" type="range" min="0" max="360" step="1" value="0" aria-label="Hue">
      <label class="field-label" for="hex">HEX</label>
      <div class="hex-row"><span id="preview" class="preview" aria-hidden="true"></span><input id="hex" type="text" value="#D14C4C" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex color"></div>
      <div class="rgb-inputs">
        <label>R<input id="red" type="number" min="0" max="255" aria-label="Red channel"></label>
        <label>G<input id="green" type="number" min="0" max="255" aria-label="Green channel"></label>
        <label>B<input id="blue" type="number" min="0" max="255" aria-label="Blue channel"></label>
      </div>
      <div class="divider"></div>
      <div class="section-heading"><h2>Next pixel</h2></div>
      <div id="cooldown" class="countdown">Loading…</div>
      <div class="divider"></div>
      <label class="grid-checkbox"><input type="checkbox" id="showGrid"><span>Show grid</span></label>
    </aside>
  </main>
</body>
</html>
